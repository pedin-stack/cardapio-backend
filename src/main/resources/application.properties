spring.application.name=ApiCardapio

# --- JWT ---------------------------------------------------------------------------------------
api.security.token.secret=${API_SECURITY_TOKEN_SECRET}
api.security.token.expiration-hours=${API_SECURITY_TOKEN_EXPIRATION_HOURS:8}
# OFFSET fixo (ex.: -03:00), lido com ZoneOffset.of(...). NÃO use ID de região.
api.security.token.timezone=${API_SECURITY_TOKEN_TIMEZONE:-03:00}
# Cookie HttpOnly do token: secure só em HTTPS (em http://localhost o navegador descartaria o cookie).
api.security.cookie.secure=${API_SECURITY_COOKIE_SECURE:false}

# --- PostgreSQL --------------------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA: o Flyway é dono do schema; o Hibernate só valida (ADR-0006 do blueprint). NUNCA update/create.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# --- Flyway --------------------------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.out-of-order=true

# --- Redis (rate limit + cache userDetails) ------------------------------------------------------
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.cache.type=${SPRING_DATA_REDIS_TYPE:redis}
spring.data.redis.repositories.enabled=false

# --- CORS: origens do front separadas por vírgula (nunca "*" com credenciais em produção) ----------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# --- Super Administrador inicial (SuperAdministradorDataLoader; só cria se não existir nenhum) -----
app.super-admin.email=${SUPER_ADMIN_EMAIL:}
app.super-admin.senha=${SUPER_ADMIN_SENHA:}

# --- Supabase Storage (REST com service-role key; a chave NUNCA vai ao front) -----------------------
# @Value no SupabaseArmazenamentoService
app.supabase.url=${SUPABASE_URL}
app.supabase.service-key=${SUPABASE_SERVICE_KEY}
app.supabase.bucket=${SUPABASE_BUCKET:cardapio-midias}

# --- Vídeo (VideoTranscodificacaoService) ----------------------------------------------------------
app.video.ffmpeg=${VIDEO_FFMPEG:ffmpeg}
app.video.ffprobe=${VIDEO_FFPROBE:ffprobe}
app.video.duracao-maxima-segundos=${VIDEO_DURACAO_MAXIMA_SEGUNDOS:90}
# Vídeos transcodificados em paralelo (AsyncConfig). Numa VPS compartilhada, 1.
app.video.threads=${VIDEO_THREADS:2}
