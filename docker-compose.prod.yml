# =====================================================================
# Produção numa VPS compartilhada, atrás de um Caddy que roda em CONTAINER (ex.: o do AutoCare).
#   docker compose -f docker-compose.prod.yml up -d --build
#
# - Postgres e Redis SEM portas publicadas: só a rede "interno". (O Docker publica portas por cima do firewall.)
# - Banco: o pg_hba.conf (deploy/postgres) só aceita, pela rede, o IP fixo da API; fora isso, só socket local
#   (docker exec = root). Redis com senha. Nenhum outro processo/container da VPS entra, mesmo alcançando a porta.
# - API: /api/* só com o segredo que o middleware do front (Vercel) injeta (FRONT_SEGREDO); Swagger desligado.
# - A API entra na rede do Caddy (PROXY_NETWORK) e fica publicada só em 127.0.0.1 (para checagens locais).
# - Serviços com prefixo "cardapio-": numa rede compartilhada, nomes como "api" ou "postgres" colidiriam no DNS
#   com os do outro sistema (o Caddy passaria a balancear para o serviço errado).
# - Vídeos HLS num volume, servidos pela API em /videos/**. Fotos ficam no bucket do Supabase.
# - Limites de CPU/RAM e de log para não disputar a máquina com o outro sistema.
# Variáveis: .env (copie de .env.example e preencha a seção de produção).
# =====================================================================
name: cardapio

x-log: &log
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:

  cardapio-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    # hba_file fora do PGDATA: a regra de acesso vem do repositório e vale mesmo com o banco já inicializado.
    command: ["postgres", "-c", "hba_file=/etc/postgresql/pg_hba.conf"]
    environment:
      POSTGRES_DB: cardapio_db
      POSTGRES_USER: ${DB_USER:-cardapio}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
    networks:
      - interno
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cardapio} -d cardapio_db"]
      interval: 10s
      retries: 10
    cpus: ${DB_CPUS:-1}
    mem_limit: ${DB_MEM_LIMIT:-512m}
    <<: *log

  # Só estado efêmero (rate limit e cache de sessão): sem persistência em disco e com teto de memória.
  cardapio-redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Senha obrigatória: o cache de sessão guarda o hash das senhas dos usuários. Vai num arquivo privado do container
    # e não como argumento (argumentos aparecem no `ps` da VPS para qualquer usuário); o `exec` deixa o Redis como PID 1.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?defina REDIS_PASSWORD no .env}
    command: ["sh", "-c", "umask 077 && printf 'requirepass %s\\n' \"$$REDIS_PASSWORD\" > /tmp/redis.conf && exec redis-server /tmp/redis.conf --save '' --appendonly no --maxmemory 64mb --maxmemory-policy allkeys-lru"]
    networks:
      - interno
    cpus: 0.5
    mem_limit: 128m
    <<: *log

  cardapio-api:
    build: .
    restart: unless-stopped
    depends_on:
      cardapio-postgres:
        condition: service_healthy
      cardapio-redis:
        condition: service_started
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8090}:8080"
    networks:
      interno:
        # IP fixo: é o único endereço que o pg_hba.conf aceita pela rede.
        ipv4_address: 172.29.89.10
      proxy: {}
    volumes:
      - videos:/data/videos
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://cardapio-postgres:5432/cardapio_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-cardapio}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: cardapio-redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      # Só o front fala com /api/*: mesmo valor de API_SEGREDO_FRONT nas variáveis da Vercel.
      FRONT_SEGREDO: ${FRONT_SEGREDO:?defina FRONT_SEGREDO (o mesmo de API_SEGREDO_FRONT na Vercel) no .env}
      SWAGGER_HABILITADO: "false"
      # Atrás do Caddy: lê X-Forwarded-For/Proto (IP real no rate limit, https reconhecido).
      SERVER_FORWARD_HEADERS_STRATEGY: native
      API_SECURITY_TOKEN_SECRET: ${API_SECURITY_TOKEN_SECRET:?defina API_SECURITY_TOKEN_SECRET no .env}
      API_SECURITY_TOKEN_EXPIRATION_HOURS: ${API_SECURITY_TOKEN_EXPIRATION_HOURS:-8}
      API_SECURITY_TOKEN_TIMEZONE: ${API_SECURITY_TOKEN_TIMEZONE:--03:00}
      # Em produção o site é HTTPS: o cookie de sessão só trafega cifrado.
      API_SECURITY_COOKIE_SECURE: ${API_SECURITY_COOKIE_SECURE:-true}
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:?defina CORS_ALLOWED_ORIGINS (ex. https://seu-front.vercel.app) no .env}"
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-}
      SUPER_ADMIN_SENHA: ${SUPER_ADMIN_SENHA:-}
      SUPABASE_URL: ${SUPABASE_URL:?defina SUPABASE_URL no .env}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:?defina SUPABASE_SERVICE_KEY no .env}
      SUPABASE_BUCKET: ${SUPABASE_BUCKET:-cardapio-midias}
      VIDEO_DURACAO_MAXIMA_SEGUNDOS: ${VIDEO_DURACAO_MAXIMA_SEGUNDOS:-90}
      VIDEO_THREADS: ${VIDEO_THREADS:-1}
      VIDEO_DIRETORIO: /data/videos
      VIDEO_URL_BASE: "${VIDEO_URL_BASE:?defina VIDEO_URL_BASE (ex. https://api.seudominio.com/videos) no .env}"
      # Heap ≤ metade do limite do container: a outra metade fica para o FFmpeg, que roda no mesmo container.
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=50 -XX:+ExitOnOutOfMemoryError"
    cpus: ${API_CPUS:-1.5}
    mem_limit: ${API_MEM_LIMIT:-1536m}
    <<: *log

volumes:
  postgres_data:
  videos:

networks:
  # Só do Cardápio: API, Postgres e Redis. Faixa fixa para a API ter IP fixo (ver deploy/postgres/pg_hba.conf).
  interno:
    ipam:
      config:
        - subnet: 172.29.89.0/28
  # Rede onde está o container do Caddy (docker network ls). No Caddyfile: reverse_proxy cardapio-api:8080
  proxy:
    name: ${PROXY_NETWORK:?defina PROXY_NETWORK (rede do container do Caddy) no .env}
    external: true
