# =====================================================================
# Quem pode conectar no Postgres de produção (montado pelo docker-compose.prod.yml).
# O Postgres testa as linhas em ordem; quem não casar com nenhuma é RECUSADO.
#
#   - socket local (dentro do container): `docker exec ... psql` — só quem manda no Docker da VPS (root).
#   - rede: SÓ o IP fixo da API (cardapio-api = 172.29.89.10 na rede "interno" do compose), com senha.
#
# Qualquer outra origem — processo na VPS, outro container, outra rede — cai fora, mesmo sabendo a senha.
# Se mudar o IP da API no compose, mude aqui também.
# =====================================================================

# TYPE  DATABASE  USER  ADDRESS            METHOD
local   all       all                      trust
host    all       all   127.0.0.1/32       trust
host    all       all   172.29.89.10/32    scram-sha-256
